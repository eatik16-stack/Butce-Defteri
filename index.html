<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bütçe Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3327;
    --ink-soft:#33513F;
    --paper:#EFEADA;
    --card:#FFFDF8;
    --gold:#B08D34;
    --amber:#C07A24;
    --good:#4C7A4F;
    --good-bg:#E7EEE3;
    --warn:#B23A48;
    --warn-bg:#F4E2E1;
    --line:#D9D0B8;
    --muted:#7A7057;
    --spine:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-left:var(--spine);
    min-height:100vh;
    background-image:
      repeating-linear-gradient(180deg, var(--ink) 0 6px, transparent 6px 14px);
    background-size:var(--spine) 100%;
    background-repeat:repeat-y;
    background-position:left top;
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 64px;}
  header{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding:22px 20px 0;
    border-bottom:1px solid var(--line);
  }
  .header-inner{max-width:900px;margin:0 auto;}
  .brand{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    margin-bottom:16px;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.01em;
    margin:0;
  }
  .brand .sub{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:2px;
  }
  .tabs{display:flex;gap:4px;}
  .tab-btn{
    font-family:'IBM Plex Sans';
    font-weight:600;
    font-size:13.5px;
    background:transparent;
    border:1px solid transparent;
    border-bottom:none;
    padding:9px 16px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    color:var(--muted);
    transition:color .15s ease;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--line);
  }
  .tab-btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }
  .io-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 0 14px;
  }
  .io-btn{
    background:#fff;border:1px solid var(--line);color:var(--ink-soft);
    font-family:'IBM Plex Sans';font-weight:600;font-size:12.5px;
    padding:6px 12px;border-radius:4px;cursor:pointer;
  }
  .io-btn:hover{border-color:var(--ink);color:var(--ink);}
  .import-status{font-size:12.5px;color:var(--muted);}
  .import-status button{
    background:none;border:1px solid var(--line);border-radius:4px;
    font-family:'IBM Plex Sans';font-weight:600;font-size:12px;
    padding:3px 10px;cursor:pointer;color:var(--ink);
  }
  .import-status button:hover{border-color:var(--ink);}
  main{padding-top:22px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:3px 3px 0 var(--line);
    padding:22px;
    margin-bottom:22px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 16px;
  }
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;}
  @media (max-width:680px){ .grid2{grid-template-columns:1fr;} }
  label{
    display:block;font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:5px;margin-top:14px;
  }
  label:first-of-type{margin-top:0;}
  input,select{
    width:100%;
    font-family:'IBM Plex Sans';
    font-size:14.5px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  input.num-input{font-family:'IBM Plex Mono';}
  .submit-btn{
    margin-top:18px;
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:11px 16px;
    border-radius:4px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .submit-btn:hover{background:var(--ink-soft);}
  .field-error{color:var(--warn);font-size:12.5px;margin-top:6px;min-height:16px;}
  .list-title{
    font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 10px;
  }
  .entry-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px dashed var(--line);
    font-size:14px;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-tag{
    font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 7px;border-radius:20px;white-space:nowrap;
  }
  .entry-tag.exp{background:var(--warn-bg);color:var(--warn);}
  .entry-tag.inc{background:var(--good-bg);color:var(--good);}
  .entry-tag.sav{background:#E3E9F5;color:#3557A0;}
  .entry-date{color:var(--muted);font-family:'IBM Plex Mono';font-size:12.5px;white-space:nowrap;}
  .entry-cat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry-amt{font-family:'IBM Plex Mono';font-weight:600;white-space:nowrap;}
  .del-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;
    padding:2px 6px;border-radius:4px;line-height:1;
  }
  .del-btn:hover{color:var(--warn);background:var(--warn-bg);}
  .empty-state{color:var(--muted);font-size:13.5px;padding:6px 0;}
  .month-select-wrap{display:flex;align-items:center;gap:8px;margin:16px 0 20px;}
  .month-select-wrap label{margin:0;}
  .month-select-wrap select{width:auto;min-width:180px;}
  .summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:680px){.summary-cards{grid-template-columns:1fr;}}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    box-shadow:3px 3px 0 var(--line);
    padding:16px 18px;
  }
  .stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;}
  .stat .v{font-family:'IBM Plex Mono';font-size:22px;font-weight:600;margin-top:4px;}
  .stat.income .v{color:var(--good);}
  .stat.expense .v{color:var(--ink);}
  .stat.savings .v.pos{color:var(--good);}
  .stat.savings .v.neg{color:var(--warn);}
  .warn-banner{
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);
    border-radius:4px;padding:12px 14px;font-size:13.5px;font-weight:500;margin-bottom:18px;
  }
  .cat-row{padding:12px 0;border-bottom:1px dashed var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-head{display:flex;align-items:baseline;gap:8px;}
  .cat-name{font-weight:600;white-space:nowrap;}
  .cat-leader{flex:1;border-bottom:1px dotted var(--line);height:0;transform:translateY(-5px);margin:0 4px;}
  .cat-figures{white-space:nowrap;font-size:13.5px;}
  .cat-figures .spent{font-weight:600;}
  .cat-figures .over{color:var(--warn);}
  .cat-figures .under{color:var(--ink);}
  .bar-track{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;background:var(--good);transition:width .2s ease;}
  .bar-fill.amber{background:var(--amber);}
  .bar-fill.over{background:var(--warn);}
  .plan-toggle{
    background:none;border:1px solid var(--line);color:var(--muted);
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:4px;cursor:pointer;
  }
  .plan-toggle:hover{border-color:var(--ink);color:var(--ink);}
  .plan-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .plan-row label{margin:0;flex:1;text-transform:none;font-size:14px;font-weight:400;color:var(--ink);}
  .plan-row input{width:120px;}
  .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .loading{padding:60px 20px;text-align:center;color:var(--muted);}
  .footnote{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:20px;}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div>
        <h1>Bütçe Defteri</h1>
        <div class="sub">Emre &amp; İrem &middot; ortak hane bütçesi</div>
      </div>
      <nav class="tabs">
        <button class="tab-btn" data-tab="entry">Kayıt</button>
        <button class="tab-btn" data-tab="dashboard">Panel</button>
        <button class="tab-btn" data-tab="savings">Birikim</button>
      </nav>
    </div>
    <div class="io-row">
      <button class="io-btn" id="exportBtn" type="button">⭳ Dışa Aktar</button>
      <button class="io-btn" id="importBtn" type="button">⭱ İçe Aktar</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none">
      <span id="importStatus" class="import-status"></span>
    </div>
  </div>
</header>
<main>
  <div class="wrap" id="app">
    <div class="loading">Yükleniyor…</div>
  </div>
</main>

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){

    });
  }

  function fmtTRY(n){
    n = Math.round(n || 0);
    var sign = n < 0 ? '-' : '';
    var abs = Math.abs(n).toString();
    var withDots = abs.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return sign + '₺' + withDots;
  }

  // Google Sheets, hücreleri kaydedilen zaman dilimine (Türkiye, +3) göre saklıyor;
  // Apps Script bunu okuyup JSON'a çevirirken UTC'ye kayıyor (ör. "2026-08-31" -> "2026-08-30T21:00:00.000Z").
  // Bu, ay başına denk gelen kayıtları yanlış aya kaydırabiliyor. Burada geri düzeltiyoruz.
  function normalizeDate(dateStr){
    if(!dateStr) return dateStr;
    if(dateStr.indexOf('T') === -1) return dateStr; // zaten düz YYYY-MM-DD
    try{
      var d = new Date(dateStr);
      if(isNaN(d.getTime())) return dateStr.slice(0,10);
      d.setUTCHours(d.getUTCHours() + 3);
      var y = d.getUTCFullYear();
      var m = (d.getUTCMonth()+1).toString().padStart(2,'0');
      var day = d.getUTCDate().toString().padStart(2,'0');
      return y + '-' + m + '-' + day;
    }catch(e){
      return dateStr.slice(0,10);
    }
  }

  // "2026-09" gibi salt-ay anahtarları da Sheets tarafından tarihe çevrilip aynı şekilde kayabiliyor
  // (GelirPlani/SabitGiderPlani sayfalarındaki "ay" sütunu). Aynı mantıkla düzeltiyoruz.
  function normalizeMonthKey(monthStr){
    if(!monthStr) return monthStr;
    var s = String(monthStr);
    if(s.indexOf('T') === -1) return s.slice(0,7);
    try{
      var d = new Date(s);
      if(isNaN(d.getTime())) return s.slice(0,7);
      d.setUTCHours(d.getUTCHours() + 3);
      var y = d.getUTCFullYear();
      var m = (d.getUTCMonth()+1).toString().padStart(2,'0');
      return y + '-' + m;
    }catch(e){
      return s.slice(0,7);
    }
  }

  function monthKeyOf(dateStr){ return (dateStr || '').slice(0,7); }

  function currentMonthKey(){
    var d = new Date();
    var m = (d.getMonth()+1).toString().padStart(2,'0');
    return d.getFullYear() + '-' + m;
  }

  function todayStr(){
    var d = new Date();
    var m = (d.getMonth()+1).toString().padStart(2,'0');
    var day = d.getDate().toString().padStart(2,'0');

  }

  function getAvailableMonths(){

    state.expenses.forEach(function(e){ set[monthKeyOf(e.date)] = true; });
    state.incomes.forEach(function(i){ set[monthKeyOf(i.date)] = true; });
    return Object.keys(set).sort().reverse();

  function sum(arr){ return arr.reduce(function(a,b){ return a+b; }, 0); }

  function computeSummary(monthKey){
    var monthExpenses = state.expenses.filter(function(e){ return monthKeyOf(e.date) === monthKey; });
    var monthIncomes = state.incomes.filter(function(i){ return monthKeyOf(i.date) === monthKey; });
    var totalIncome = sum(monthIncomes.map(function(i){ return i.amount; }));
    var totalExpense = sum(monthExpenses.map(function(e){ return e.amount; }));
    var perCategory = state.config.categories.map(function(c){
      var spent = sum(monthExpenses.filter(function(e){ return e.category === c.name; }).map(function(e){ return e.amount; }));
      var pct = c.planned > 0 ? (spent / c.planned * 100) : (spent > 0 ? 100 : 0);
      return {name:c.name, planned:c.planned, spent:spent, remaining:c.planned-spent, pct:pct};
    });
    return {totalIncome:totalIncome, totalExpense:totalExpense, perCategory:perCategory, savings: totalIncome-totalExpense};
  }

  var FIXED_CATEGORY_NAMES = ["Ev kirası","Ev aidatı","Kredi Kartı Kredisi","Kreş","Ofis Kirası","Ofis Aidatı","Ofis Stopaj","Ofis Sigorta","Ofis Genel Gider","Fatura","Jimnastik","LG TV Taksit","Araba kredisi"];

  function computeVariableBudgetTotal(){
    return sum(state.config.categories
      .filter(function(c){ return FIXED_CATEGORY_NAMES.indexOf(c.name) === -1; })
      .map(function(c){ return c.planned; }));
  }

  function computeSavingsSummary(){
    var rates = state.config.currentRates || {gramAltin:0, usd:0, eur:0};
    var totalActual = sum(state.savings.map(function(s){ return tlEquivalent(s, rates); }));
    var goal = state.config.savingsGoal || 0;
    var incomePlan = state.config.incomePlan || [];
    var fixedPlan = state.config.fixedExpensePlan || [];
    var variableTotal = computeVariableBudgetTotal();
    var cumActual = 0, cumTarget = 0;
    var rows = incomePlan.map(function(ip, idx){
      var fp = fixedPlan[idx] || {amount:0};
      var target = ip.amount - fp.amount - variableTotal;
      var monthActual = sum(state.savings.filter(function(s){ return monthKeyOf(s.date) === ip.month; }).map(function(s){ return tlEquivalent(s, rates); }));
      cumActual += monthActual;
      cumTarget += target;
      return {
        month: ip.month,
        income: ip.amount,
        fixed: fp.amount,
        variable: variableTotal,
        target: target,
        actual: monthActual,
        diff: monthActual - target,
        cumActual: cumActual,
        cumTarget: cumTarget
      };
    });
    return { totalActual: totalActual, goal: goal, rows: rows, totalTarget: cumTarget, variableTotal: variableTotal };
  }

  function computePortfolioBreakdown(){
    var rates = state.config.currentRates || {gramAltin:0, usd:0, eur:0};
    var byInstrument = {};
    SAVINGS_INSTRUMENTS.forEach(function(i){ byInstrument[i] = {instrument:i, nativeAmount:0, tlAmount:0}; });
    state.savings.forEach(function(s){
      if(!byInstrument[s.instrument]){ byInstrument[s.instrument] = {instrument:s.instrument, nativeAmount:0, tlAmount:0}; }
      byInstrument[s.instrument].nativeAmount += s.amount;
      byInstrument[s.instrument].tlAmount += tlEquivalent(s, rates);
    });
    var list = SAVINGS_INSTRUMENTS.map(function(i){ return byInstrument[i]; });
    var grandTotal = sum(list.map(function(x){ return x.tlAmount; }));
    list.forEach(function(x){ x.pct = grandTotal > 0 ? (x.tlAmount / grandTotal * 100) : 0; });
    return { list: list, grandTotal: grandTotal };

      return {ok:true, data:data};

  async function apiSave(payload){

      return {ok:false, reason:(e && e.message) || 'ağ hatası'};

      state.storageAvailable = false;
      state.loadFailed = false;
      state.storageWarning = 'Google Sheets bağlantısı henüz ayarlanmadı. Şimdilik girdiğiniz kayıtlar yalnızca bu oturumda görünecek — "Dışa Aktar" ile yedek alabilirsiniz. Bağlantı hazır olduğunda bu uyarı kaybolacak.';
      state.loading = false;
      state.dashboardMonth = currentMonthKey();
      render();
      return;
    }

    var result = await apiLoad();
    if(result.ok){
      var d = result.data || {};
      var cfgEmpty = !d.config || !d.config.categories || d.config.categories.length === 0;
      var expEmpty = !d.expenses || d.expenses.length === 0;
      var ratesNeededBackfill = false;
      state.config = cfgEmpty ? DEFAULT_CONFIG : d.config;
      // Eski sheet verisi savingsGoal/incomePlan/fixedExpensePlan alanlarından önce yazılmış olabilir - eksikse varsayılanla tamamla.
      if(!cfgEmpty){
        if(state.config.savingsGoal === undefined || state.config.savingsGoal === null){
          state.config.savingsGoal = DEFAULT_CONFIG.savingsGoal;
        }
        if(!state.config.incomePlan || !state.config.incomePlan.length){
          state.config.incomePlan = DEFAULT_CONFIG.incomePlan;
        }
        if(!state.config.fixedExpensePlan || !state.config.fixedExpensePlan.length){
          state.config.fixedExpensePlan = DEFAULT_CONFIG.fixedExpensePlan;
        }
        var cr = state.config.currentRates;
        if(!cr || (!cr.gramAltin && !cr.usd && !cr.eur)){
          state.config.currentRates = DEFAULT_CONFIG.currentRates;
          ratesNeededBackfill = true;
        }
      }

      // "ay" anahtarları da (GelirPlani/SabitGiderPlani) aynı Sheets tarih-kayması sorunundan etkilenmiş olabilir.
      var monthKeysFixed = false;
      state.config.incomePlan = (state.config.incomePlan || []).map(function(p){
        var fixed = normalizeMonthKey(p.month);
        if(fixed !== p.month){ monthKeysFixed = true; }
        return {month: fixed, amount: p.amount};
      });
      state.config.fixedExpensePlan = (state.config.fixedExpensePlan || []).map(function(p){
        var fixed = normalizeMonthKey(p.month);
        if(fixed !== p.month){ monthKeysFixed = true; }
        return {month: fixed, amount: p.amount};
      });

      // Kaldırılan kategorileri (ör. "Kırtasiye") daha önce Sheet'e yazılmışsa listeden temizle.
      var REMOVED_CATEGORIES = ["Kırtasiye"];
      var categoryRemoved = false;
      var beforeCatCount = (state.config.categories || []).length;
      state.config.categories = (state.config.categories || []).filter(function(c){
        return REMOVED_CATEGORIES.indexOf(c.name) === -1;
      });
      if(state.config.categories.length !== beforeCatCount){ categoryRemoved = true; }

      state.expenses = expEmpty ? SEED_EXPENSES.slice() : d.expenses;
      state.incomes = d.incomes || [];
      state.savings = d.savings || [];

      // Sheets'in saat dilimi kaymasından kaynaklanan tarih hatalarını düzelt.
      var datesFixed = false;
      state.expenses.forEach(function(e){
        var fixed = normalizeDate(e.date);
        if(fixed !== e.date){ datesFixed = true; }
        e.date = fixed;
      });
      state.incomes.forEach(function(i){
        var fixed = normalizeDate(i.date);
        if(fixed !== i.date){ datesFixed = true; }
        i.date = fixed;
      });
      state.savings.forEach(function(s){
        var fixed = normalizeDate(s.date);
        if(fixed !== s.date){ datesFixed = true; }
        s.date = fixed;
      });

      state.storageAvailable = true;
      state.loadFailed = false;
      state.storageWarning = '';
      state.loading = false;
      state.dashboardMonth = currentMonthKey();
      render();
      if(cfgEmpty || expEmpty || ratesNeededBackfill || datesFixed || monthKeysFixed || categoryRemoved){
        // Sheet ilk kez kullanılıyor, kurlar hiç girilmemiş, ya da tarih kayması düzeltildi: geri yaz.
        persistAll();
      }
    } else {
      state.config = DEFAULT_CONFIG;
      state.expenses = [];
      state.incomes = [];
      state.savings = [];
      state.storageAvailable = false;
      state.loadFailed = true;
      state.storageWarning = 'Google Sheets\'e bağlanılamadı (' + result.reason + '). İnterneti kontrol edip "Tekrar Dene"yi kullanın.';
      state.loading = false;
      state.dashboardMonth = currentMonthKey();
      render();
    }
  }

  function applyPersistResult(result){
    if(result.ok){
      state.storageAvailable = true;
      state.storageWarning = '';
    } else {
      state.storageAvailable = false;
      state.storageWarning = 'Son değişiklik Google Sheets\'e kaydedilemedi (' + result.reason + '). Kayıt bu oturumda görünmeye devam ediyor ama sayfa yenilenirse kaybolabilir. "Tekrar Dene"yi kullanın veya "Dışa Aktar" ile yedek alın.';
    }
  }

  // ---------- export / import (yedek / kurtarma amaçlı) ----------
  function showImportStatus(html){
    var el = document.getElementById('importStatus');
    if(el){ el.innerHTML = html; }
  }

  function exportData(){
    var payload = { exportedAt: new Date().toISOString(), config: state.config, expenses: state.expenses, incomes: state.incomes, savings: state.savings };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'butce-defteri-yedek-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    showImportStatus('<span style="color:var(--good);">Yedek dosyası indirildi.</span>');
  }

  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        if(!data || !Array.isArray(data.expenses) || !Array.isArray(data.incomes) || !data.config || !Array.isArray(data.config.categories)){
          throw new Error('Dosya formatı tanınmadı.');
        }
        pendingImportData = data;
        showImportStatus(
          (data.expenses.length + ' gider, ' + data.incomes.length + ' gelir kaydı bulundu. Onaylarsanız ekrandaki mevcut verilerin üzerine yazılacak.')
          + ' <button id="confirmImportBtn" type="button">Onayla</button>'
          + ' <button id="cancelImportBtn" type="button">Vazgeç</button>'
        );
        var confirmBtn = document.getElementById('confirmImportBtn');
        var cancelBtn = document.getElementById('cancelImportBtn');
        if(confirmBtn){
          confirmBtn.onclick = async function(){
            state.config = pendingImportData.config;
            state.expenses = pendingImportData.expenses;
            state.incomes = pendingImportData.incomes;
            state.savings = pendingImportData.savings || [];
            state.expenses.forEach(function(e){ e.date = normalizeDate(e.date); });
            state.incomes.forEach(function(i){ i.date = normalizeDate(i.date); });
            state.savings.forEach(function(s){ s.date = normalizeDate(s.date); });
            state.dashboardMonth = currentMonthKey();
            pendingImportData = null;
            showImportStatus('<span style="color:var(--good);">İçe aktarma tamamlandı.</span>');
            render();
            var result = await persistAll();
            applyPersistResult(result);
            render();
          };
        }
        if(cancelBtn){
          cancelBtn.onclick = function(){ pendingImportData = null; showImportStatus(''); };
        }
      }catch(e){
        showImportStatus('<span style="color:var(--warn);">Dosya okunamadı: '+escapeHtml((e && e.message) || String(e))+'</span>');
      }
    };
    reader.onerror = function(){
      showImportStatus('<span style="color:var(--warn);">Dosya okunamadı.</span>');
    };
    reader.readAsText(file);
  }

  function bindStaticControls(){
    var exportBtn = document.getElementById('exportBtn');
    if(exportBtn){ exportBtn.onclick = exportData; }
    var importBtn = document.getElementById('importBtn');
    var importInput = document.getElementById('importFileInput');
    if(importBtn && importInput){
      importBtn.onclick = function(){ importInput.click(); };
      importInput.onchange = function(){
        if(importInput.files && importInput.files[0]){
          handleImportFile(importInput.files[0]);
        }
        importInput.value = '';
      };
    }
  }

  // ---------- render ----------
  function render(){
    if(state.loading){
      app.innerHTML = '<div class="loading">Yükleniyor…</div>';
      return;
    }
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-tab') === state.activeTab);
    });
    var banner = state.storageWarning
      ? (hasApi()
          ? '<div class="warn-banner" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">'
            + '<span>⚠ ' + escapeHtml(state.storageWarning) + '</span>'
            + '<button class="plan-toggle" id="retryStorage" style="white-space:nowrap;">Tekrar Dene</button>'
            + '</div>'
          : '<div class="warn-banner">⚠ ' + escapeHtml(state.storageWarning) + '</div>')
      : '';
    if(state.activeTab === 'entry'){
      app.innerHTML = banner + renderEntryTab();
    } else if(state.activeTab === 'savings'){
      app.innerHTML = banner + renderBirikimTab();
    } else {
      app.innerHTML = banner + renderDashboardTab();
    }
    bindEvents();
  }

      +       '<div class="field-error">'+(state.errors.expense||'')+'</div>'

      +       '<label for="incDesc">Açıklama (opsiyonel)</label>'

  function renderDashboardTab(){
    var months = getAvailableMonths();
    if(months.indexOf(state.dashboardMonth) === -1){ months.unshift(state.dashboardMonth); }
    var monthOptions = months.map(function(m){
      return '<option value="'+m+'"'+(m===state.dashboardMonth?' selected':'')+'>'+monthLabel(m)+'</option>';
    }).join('');

    var s = computeSummary(state.dashboardMonth);
    var savingsClass = s.savings >= 0 ? 'pos' : 'neg';

    var overCats = s.perCategory.filter(function(c){ return c.spent > c.planned; });
    var warnBanner = overCats.length
      ? '<div class="warn-banner">⚠ Bütçe aşıldı: '+overCats.map(function(c){return escapeHtml(c.name);}).join(', ')+'. '+(overCats.length===1?'Bu kalemde':'Bu kalemlerde')+' ay sonuna kadar harcamayı sınırlamanız önerilir.</div>'
      : '';

    var catRows = s.perCategory.map(function(c){
      var barClass = c.pct >= 100 ? 'over' : (c.pct >= 85 ? 'amber' : '');
      var figClass = c.spent > c.planned ? 'over' : 'under';
      return '<div class="cat-row">'
        + '<div class="cat-head">'
        +   '<span class="cat-name">'+escapeHtml(c.name)+'</span>'
        +   '<span class="cat-leader"></span>'
        +   '<span class="cat-figures"><span class="spent '+figClass+'">'+fmtTRY(c.spent)+'</span> / '+fmtTRY(c.planned)+'</span>'
        + '</div>'
        + '<div class="bar-track"><div class="bar-fill '+barClass+'" style="width:'+Math.min(100, c.pct)+'%"></div></div>'
        + '</div>';
    }).join('');

    var planSection = state.editingPlan ? renderPlanEditor() : '';

    return ''
      + '<div class="month-select-wrap">'

      +   '<div class="stat expense"><div class="k">Toplam Gider</div><div class="v num">'+fmtTRY(s.totalExpense)+'</div></div>'
      +   '<div class="stat savings"><div class="k">Birikim (Kalan)</div><div class="v num '+savingsClass+'">'+fmtTRY(s.savings)+'</div></div>'
      + '</div>'
      + warnBanner
      + '<div class="card">'
      +   '<div class="top-row">'
      +     '<h2>Kalem Kalem Bütçe — '+monthLabel(state.dashboardMonth)+'</h2>'
      +     '<button class="plan-toggle" id="togglePlanEdit">'+(state.editingPlan ? 'Vazgeç' : 'Planı Düzenle')+'</button>'
      +   '</div>'
      +   planSection
      +   (state.editingPlan ? '' : catRows)

    var rows = state.config.categories.map(function(c, idx){
      return '<div class="plan-row"><label for="plan_'+idx+'">'+escapeHtml(c.name)+'</label>'
        + '<input type="number" min="0" step="1" class="num-input" id="plan_'+idx+'" value="'+c.planned+'"></div>';
    }).join('');

    var remaining = s.goal - s.totalActual;
    var remainingHtml = remaining > 0
      ? fmtTRY(remaining) + ' kaldı'
      : '<span style="color:var(--good);font-weight:600;">Hedefe ulaşıldı 🎉</span>';

    var goalCard = '<div class="card">'
      + '<div class="top-row"><h2>'+fmtTRY(s.goal)+' Hedefi</h2>'
      +   '<button class="plan-toggle" id="toggleSavingsPlanEdit">'+(state.editingSavingsPlan ? 'Vazgeç' : 'Hedefi Düzenle')+'</button></div>'
      + '<div style="margin:12px 0 6px;font-family:\'IBM Plex Mono\';font-size:28px;font-weight:600;">'
      +   fmtTRY(s.totalActual) + ' <span style="font-size:15px;color:var(--muted);font-weight:400;">/ '+fmtTRY(s.goal)+'</span>'

      + '<div class="bar-track" style="height:9px;"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
      + '<div style="margin-top:8px;font-size:13px;color:var(--muted);">'+remainingHtml+'</div>'

    var planEditorHtml = state.editingSavingsPlan ? renderSavingsPlanEditor() : '';

    var capacityNote = '<div class="footnote" style="margin-top:0;">Hedef = Gelir − Sabit Giderler − Değişken Kategori Bütçeleri. Değişken kısmı (şu an <strong>'+fmtTRY(s.variableTotal)+'</strong>/ay) Panel &gt; Planı Düzenle\'deki kategorilerden canlı hesaplanır. 12 ayın toplam hedefi: <strong>'+fmtTRY(s.totalTarget)+'</strong>.</div>';

    var rowsHtml = state.editingSavingsPlan ? '' : s.rows.map(function(r){
      var diffColor = r.diff >= 0 ? 'var(--good)' : 'var(--warn)';
      var diffSign = r.diff >= 0 ? '+' : '';
      var barColor = r.actual >= r.target ? 'var(--good)' : 'var(--amber)';
      var barPct = r.target > 0 ? Math.min(100, r.actual / r.target * 100) : (r.actual > 0 ? 100 : 0);
      return '<div class="cat-row">'
        + '<div class="cat-head">'
        +   '<span class="cat-name">'+monthLabel(r.month)+'</span>'
        +   '<span class="cat-leader"></span>'
        +   '<span class="cat-figures">'+fmtTRY(r.actual)+' / '+fmtTRY(r.target)+'</span>'
        + '</div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:'+barPct+'%;background:'+barColor+';"></div></div>'
        + '<div style="display:flex;justify-content:space-between;margin-top:5px;font-size:12.5px;color:var(--muted);">'
        +   '<span>Fark: <span style="color:'+diffColor+';font-weight:600;">'+diffSign+fmtTRY(r.diff)+'</span></span>'
        +   '<span>Kümülatif: '+fmtTRY(r.cumActual)+' / '+fmtTRY(r.cumTarget)+'</span>'
        + '</div>'
        + '<div style="margin-top:4px;font-size:11.5px;color:var(--muted);">Gelir '+fmtTRY(r.income)+' − Sabit '+fmtTRY(r.fixed)+' − Değişken '+fmtTRY(r.variable)+'</div>'
        + '</div>';
    }).join('');

    var portfolio = computePortfolioBreakdown();
    var rates = state.config.currentRates || {gramAltin:0, usd:0, eur:0};
    var ratesEditorHtml = state.editingRates ? renderRatesEditor() : '';
    var portfolioRows = state.editingRates ? '' : portfolio.list
      .filter(function(x){ return x.nativeAmount !== 0; })
      .map(function(x){
        return '<div class="cat-row">'
          + '<div class="cat-head">'
          +   '<span class="cat-name">'+escapeHtml(x.instrument)+'</span>'
          +   '<span class="cat-leader"></span>'
          +   '<span class="cat-figures">'+formatNativeAmount(x.instrument, x.nativeAmount)+'</span>'
          + '</div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'+x.pct+'%;"></div></div>'
          + '<div style="display:flex;justify-content:space-between;margin-top:5px;font-size:12.5px;color:var(--muted);">'
          +   '<span>TL karşılığı: <strong style="color:var(--ink);">'+fmtTRY(x.tlAmount)+'</strong></span>'
          +   '<span>%'+x.pct.toFixed(1)+'</span>'
          + '</div>'
          + '</div>';
      }).join('');
    var portfolioEmpty = (portfolio.list.every(function(x){ return x.nativeAmount === 0; }) && !state.editingRates)
      ? '<div class="empty-state">Henüz birikim kaydı yok.</div>' : '';

    var ratesCard = '<div class="card">'
      + '<div class="top-row"><h2>Portföy Dağılımı</h2>'
      +   '<button class="plan-toggle" id="toggleRatesEdit">'+(state.editingRates ? 'Vazgeç' : 'Kurları Güncelle')+'</button></div>'
      + '<div class="footnote" style="margin-top:0;">TL karşılıkları güncel kur/altın fiyatına göre hesaplanır (geçmiş girişlerin tarihindeki kur değil) — gram altın '+fmtTRY(rates.gramAltin)+', dolar '+rates.usd.toLocaleString('tr-TR')+' ₺, euro '+rates.eur.toLocaleString('tr-TR')+' ₺.</div>'
      + ratesEditorHtml
      + portfolioRows
      + portfolioEmpty
      + '</div>';

    return goalCard
      + '<div class="card">'
      +   capacityNote
      +   planEditorHtml
      +   rowsHtml
      + '</div>'
      + ratesCard;
  }

  function renderRatesEditor(){
    var r = state.config.currentRates;
    return '<form id="ratesForm">'
      + '<div class="plan-row"><label for="rateGoldInput" style="flex:1;">Gram Altın (₺)</label><input type="number" min="0" step="1" class="num-input" id="rateGoldInput" value="'+r.gramAltin+'" style="width:140px;"></div>'
      + '<div class="plan-row"><label for="rateUsdInput" style="flex:1;">Dolar (₺)</label><input type="number" min="0" step="0.01" class="num-input" id="rateUsdInput" value="'+r.usd+'" style="width:140px;"></div>'
      + '<div class="plan-row"><label for="rateEurInput" style="flex:1;">Euro (₺)</label><input type="number" min="0" step="0.01" class="num-input" id="rateEurInput" value="'+r.eur+'" style="width:140px;"></div>'
      + '<button type="submit" class="submit-btn">Kurları Kaydet</button>'
      + '</form>';
  }

  function renderSavingsPlanEditor(){
    var goalRow = '<div class="plan-row"><label for="savGoalInput" style="flex:1;">Toplam Hedef (TL)</label>'
      + '<input type="number" min="0" step="1000" class="num-input" id="savGoalInput" value="'+state.config.savingsGoal+'" style="width:160px;"></div>';
    var rows = state.config.incomePlan.map(function(ip, idx){
      var fp = state.config.fixedExpensePlan[idx];
      return '<div class="plan-row" style="align-items:flex-start;">'
        + '<label style="flex:1;padding-top:8px;">'+monthLabel(ip.month)+'</label>'
        + '<div style="display:flex;flex-direction:column;gap:4px;">'
        +   '<div style="display:flex;align-items:center;gap:6px;"><span style="font-size:11px;color:var(--muted);width:52px;">Gelir</span><input type="number" min="0" step="100" class="num-input" id="income_plan_'+idx+'" value="'+ip.amount+'" style="width:130px;"></div>'
        +   '<div style="display:flex;align-items:center;gap:6px;"><span style="font-size:11px;color:var(--muted);width:52px;">Sabit</span><input type="number" min="0" step="100" class="num-input" id="fixed_plan_'+idx+'" value="'+fp.amount+'" style="width:130px;"></div>'
        + '</div>'
        + '</div>';
    }).join('');
    return '<form id="savingsPlanForm">' + goalRow + rows + '<button type="submit" class="submit-btn">Hedefi Kaydet</button></form>';
  }

  // ---------- events ----------
  function bindEvents(){
    var retryBtn = document.getElementById('retryStorage');
    if(retryBtn){
      retryBtn.onclick = async function(){
        retryBtn.textContent = 'Deneniyor…';
        if(state.loadFailed){
          state.loading = true;
          render();
          await loadAll();
        } else {
          var result = await persistAll();
          applyPersistResult(result);
          render();
        }
      };
    }

    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.onclick = function(){
        state.activeTab = btn.getAttribute('data-tab');
        state.errors = {};
        render();
      };
    });

    var expForm = document.getElementById('expenseForm');
    if(expForm){
      expForm.onsubmit = function(ev){
        ev.preventDefault();
        state.errors.expense = '';
        var date = document.getElementById('expDate').value;
        var amount = parseFloat(document.getElementById('expAmount').value);
        var desc = document.getElementById('expDesc').value.trim();
        var category = document.getElementById('expCategory').value;
        if(!date || !amount || amount <= 0 || !category){
          state.errors.expense = 'Lütfen tarih, geçerli bir tutar ve kategori girin.';
          render();
          return;
        }
        addExpense(date, amount, category, desc);
      };
    }

    var incForm = document.getElementById('incomeForm');
    if(incForm){
      incForm.onsubmit = function(ev){
        ev.preventDefault();
        state.errors.income = '';
        var date = document.getElementById('incDate').value;
        var amount = parseFloat(document.getElementById('incAmount').value);
        var desc = document.getElementById('incDesc').value.trim();
        var category = document.getElementById('incCategory').value;
        if(!date || !amount || amount <= 0 || !category){
          state.errors.income = 'Lütfen tarih, geçerli bir tutar ve kategori girin.';
          render();
          return;
        }
        addIncome(date, amount, desc, category);
      };
    }

    var savForm = document.getElementById('savingForm');
    if(savForm){
      savForm.onsubmit = function(ev){
        ev.preventDefault();
        state.errors.saving = '';
        var date = document.getElementById('savDate').value;
        var instrument = document.getElementById('savInstrument').value;
        var amount = parseFloat(document.getElementById('savAmount').value);
        var desc = document.getElementById('savDesc').value.trim();
        if(!date || !amount || isNaN(amount)){
          state.errors.saving = 'Lütfen tarih ve geçerli (sıfırdan farklı) bir miktar girin.';
          render();
          return;
        }
        addSaving(date, amount, instrument, desc);
      };
    }

    var savInstrumentSelect = document.getElementById('savInstrument');
    if(savInstrumentSelect){
      savInstrumentSelect.onchange = function(){
        var lbl = document.getElementById('savAmountLabel');
        var val = savInstrumentSelect.value;
        if(lbl){
          if(val === 'Altın (gram)'){ lbl.textContent = 'Miktar (gram)'; }
          else if(val === 'Dolar'){ lbl.textContent = 'Miktar ($)'; }
          else if(val === 'Euro'){ lbl.textContent = 'Miktar (€)'; }
          else { lbl.textContent = 'Tutar (₺)'; }
        }
      };
    }

    document.querySelectorAll('[data-del]').forEach(function(btn){
      btn.onclick = function(){
        var type = btn.getAttribute('data-del');
        var id = btn.getAttribute('data-id');
        if(type === 'exp'){ deleteExpense(id); }
        else if(type === 'inc'){ deleteIncome(id); }
        else if(type === 'sav'){ deleteSaving(id); }
      };
    });

    var monthSelect = document.getElementById('monthSelect');
    if(monthSelect){
      monthSelect.onchange = function(){
        state.dashboardMonth = monthSelect.value;
        render();
      };
    }

    var toggleBtn = document.getElementById('togglePlanEdit');
    if(toggleBtn){
      toggleBtn.onclick = function(){
        state.editingPlan = !state.editingPlan;
        render();
      };
    }

    var planForm = document.getElementById('planForm');
    if(planForm){
      planForm.onsubmit = function(ev){
        ev.preventDefault();
        var newPlanned = state.config.categories.map(function(c, idx){
          var v = parseFloat(document.getElementById('plan_'+idx).value);
          return isNaN(v) || v < 0 ? c.planned : v;
        });
        savePlan(newPlanned);
      };
    }

    var toggleSavPlanBtn = document.getElementById('toggleSavingsPlanEdit');
    if(toggleSavPlanBtn){
      toggleSavPlanBtn.onclick = function(){
        state.editingSavingsPlan = !state.editingSavingsPlan;
        render();
      };
    }

    var savingsPlanForm = document.getElementById('savingsPlanForm');
    if(savingsPlanForm){
      savingsPlanForm.onsubmit = function(ev){
        ev.preventDefault();
        var newGoal = parseFloat(document.getElementById('savGoalInput').value);
        if(isNaN(newGoal) || newGoal < 0){ newGoal = state.config.savingsGoal; }
        var newIncomePlan = state.config.incomePlan.map(function(ip, idx){
          var v = parseFloat(document.getElementById('income_plan_'+idx).value);
          return {month:ip.month, amount: (isNaN(v) || v < 0) ? ip.amount : v};
        });
        var newFixedPlan = state.config.fixedExpensePlan.map(function(fp, idx){
          var v = parseFloat(document.getElementById('fixed_plan_'+idx).value);
          return {month:fp.month, amount: (isNaN(v) || v < 0) ? fp.amount : v};
        });
        saveSavingsPlan(newGoal, newIncomePlan, newFixedPlan);
      };
    }

    var toggleRatesBtn = document.getElementById('toggleRatesEdit');
    if(toggleRatesBtn){
      toggleRatesBtn.onclick = function(){
        state.editingRates = !state.editingRates;
        render();
      };
    }

    var ratesForm = document.getElementById('ratesForm');
    if(ratesForm){
      ratesForm.onsubmit = function(ev){
        ev.preventDefault();
        var r = state.config.currentRates;
        var gold = parseFloat(document.getElementById('rateGoldInput').value);
        var usd = parseFloat(document.getElementById('rateUsdInput').value);
        var eur = parseFloat(document.getElementById('rateEurInput').value);
        var newRates = {
          gramAltin: (isNaN(gold) || gold < 0) ? r.gramAltin : gold,
          usd: (isNaN(usd) || usd < 0) ? r.usd : usd,
          eur: (isNaN(eur) || eur < 0) ? r.eur : eur
        };
        saveCurrentRates(newRates);
      };
    }
  }

  bindStaticControls();
  loadAll();
})();
</script>
</body>
</html>
